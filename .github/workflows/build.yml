name: Build and Test

on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main, release]

permissions:
  contents: read

jobs:
  backend:
    name: Backend Build and Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore GitDashboard.Tests/GitDashboard.Tests.csproj

      - name: Build
        run: dotnet build GitDashboard.Tests/GitDashboard.Tests.csproj --configuration Release --no-restore

      - name: Run xUnit tests
        run: dotnet test GitDashboard.Tests/GitDashboard.Tests.csproj --configuration Release --no-build --verbosity normal

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  docker:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --tag gitdashboard:ci .